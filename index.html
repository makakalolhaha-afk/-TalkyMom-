<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkyMom 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="title">TalkyMom</div>
  <nav>
    <button class="nav-btn active" data-page="home">Home</button>
    <button class="nav-btn" data-page="lessons">Lessons</button>
    <button class="nav-btn" data-page="kids">Kids</button>
    <button class="nav-btn" data-page="library">Library</button>
    <button class="nav-btn" data-page="progress">Progress</button>
  </nav>
</header>

<main class="container">
  <section id="home" class="page active">
    <h1>Welcome to TalkyMom 💬</h1>
    <p>Interactive English learning for moms with children 1–3 years.</p>
  </section>

  <section id="lessons" class="page">
    <h2>Lessons</h2>
    <select id="topic-select"></select>
    <button id="mark-complete" class="btn">Mark as Completed</button>
    <button id="play-all" class="btn outline">🔊 Play All</button>
    <div id="flashcards" class="flashcard-grid"></div>
  </section>

  <section id="kids" class="page">
    <h2>Kids Ideas</h2>
    <ul id="kids-ideas"></ul>
  </section>

  <section id="library" class="page">
    <h2>Library</h2>
    <ul id="library-list"></ul>
  </section>

  <section id="progress" class="page">
    <h2>Progress</h2>
    <p id="progress-text"></p>
    <button id="reset-progress" class="btn outline">Reset Progress</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
